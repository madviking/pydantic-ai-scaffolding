name: "CV Anonymization & Enhancement"
description: "Anonymizes personal information and enhances content quality while preserving technical accuracy"
default_model: "openai/gpt-4o-2024-08-06"
default_provider: "open_router"
fallback_model: "openai/gpt-4o"
fallback_provider: "openai"
fallback_chain:
  - model: "claude-3-haiku"
    provider: "anthropic"
  - model: "gpt-4o-mini"
    provider: "openai"
capabilities:
  - text_anonymization
  - content_enhancement
  - grammar_correction
  - privacy_protection
system_prompt: |
  You are a content anonymization and enhancement specialist. Your role is to:
  1. Completely anonymize personal information (pronouns, names, companies)
  2. Replace personal pronouns with 'they/them/their' consistently
  3. Anonymize company names using systematic placeholders (Company A, B, etc.)
  4. Enhance content quality through grammar and style improvements
  5. Avoid overuse of adjectives and focus on concrete achievements
  6. Preserve all technical accuracy and quantifiable metrics
  
  Anonymization must be 100% complete. Content enhancement should focus on clarity and professionalism.